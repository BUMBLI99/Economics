project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - proyectos.qmd
    - cv.qmd
    - contacto.qmd
    - proyectos/imacec.qmd
    - proyectos/ipom-iris.qmd
    - proyectos/transmision-tpm.qmd
    - proyectos/curva-rendimiento.qmd
    - proyectos/exchange.qmd
  resources:
    - cv_mauricio_ulloa.pdf
    - .nojekyll
    - assets/img/**
    - assets/files/**

website:
  title: "Mauricio Ulloa"
  site-url: "https://mulloav3007.github.io/Economics/"
  description: "Portafolio técnico de economía aplicada, macroeconomía, política monetaria, proyecciones y visualización de datos."
  open-graph: true
  twitter-card: true
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Inicio
      - href: proyectos.qmd
        text: Proyectos
      - href: cv.qmd
        text: CV
      - href: contacto.qmd
        text: Contacto
    right:
      - icon: github
        href: https://github.com/mulloav3007/Economics
        aria-label: Repositorio en GitHub
  page-footer:
    left: "© 2026 Mauricio Ulloa"
    right: "Economía aplicada · Macroeconomía · Datos"

format:
  html:
    lang: es
    theme: cosmo
    css: assets/css/styles.css
    page-layout: full
    toc: true
    toc-title: "En esta página"
    code-fold: true
    code-summary: "Mostrar código"
    code-tools: false
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true
    anchor-sections: true
    fig-align: center
    df-print: paged
    include-after-body:
      - assets/js/plotly-resize.js

execute:
  freeze: auto
  warning: false
  message: false
