<div class="analysis-grid">
  {% for a in articles %}
  <article class="analysis-card">
    <p class="eyebrow">{{ a.category }}</p>
    <div class="analysis-meta"><time datetime="{{ a.date }}">{{ a.date_label }}</time><span>{{ a.reading_minutes }} min de lectura</span></div>
    <h3><a href="{{ base_path }}analisis/{{ a.slug }}.html">{{ a.title }}</a></h3>
    <p>{{ a.description }}</p>
    <a class="text-link" href="{{ base_path }}analisis/{{ a.slug }}.html" aria-label="Leer columna: {{ a.title }}">Leer columna →</a>
  </article>
  {% endfor %}
</div>
