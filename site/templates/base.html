<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Joaquín Zaragoza López</title>
  <meta name="description" content="{{ description }}">
  <meta name="author" content="Joaquín Zaragoza López">
  <meta name="theme-color" content="#f4f1eb">
  <link rel="canonical" href="{{ canonical_url }}">
  <meta property="og:type" content="{{ og_type|default('website') }}">
  <meta property="og:title" content="{{ title }} · Joaquín Zaragoza López">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:image" content="{{ og_image_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ base_path }}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ base_path }}assets/css/site.css?v={{ asset_version }}">
  {% block extra_head %}{% endblock %}
</head>
<body class="{{ body_class|default('') }}">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ base_path }}index.html" aria-label="Home">
        <span class="brand-mark">MU</span>
        <span>Joaquín Zaragoza</span>
      </a>
      <button class="menu-toggle" type="button" aria-label="Abrir navegación" aria-expanded="false">☰</button>
      <nav class="site-nav" aria-label="Navegación principal">
        <a href="{{ base_path }}index.html" {% if active_nav == 'inicio' %}aria-current="page"{% endif %}>Inicio</a>
        <a href="{{ base_path }}proyectos.html" {% if active_nav == 'proyectos' %}aria-current="page"{% endif %}>Proyectos</a>
        <a href="{{ base_path }}analisis.html" {% if active_nav == 'analisis' %}aria-current="page"{% endif %}>Análisis</a>
        <a href="{{ base_path }}cv.html" {% if active_nav == 'cv' %}aria-current="page"{% endif %}>CV</a>
        <a href="{{ base_path }}contacto.html" {% if active_nav == 'contacto' %}aria-current="page"{% endif %}>Contacto</a>
      </nav>
    </div>
  </header>

  <main id="contenido" class="site-main">
    {% block main %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>© <span data-current-year>2026</span> Joaquín Zaragoza López · Personal Portfolio.</div>
      <div class="footer-links">
        <a href="{{ base_path }}contacto.html">Contacto</a>
      </div>
    </div>
  </footer>
  <button class="back-to-top" type="button" aria-label="Back to top">↑</button>
  <script src="{{ base_path }}assets/js/site.js?v={{ asset_version }}" defer></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
